<section id="faqs" class="relative py-20 lg:py-32 bg-[#091711] text-[#E8ECE9] border-t border-emerald-950/40 overflow-hidden">
  
  <!-- Background glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-emerald-950/20 rounded-full blur-[160px] pointer-events-none"></div>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    
    <!-- Section Header -->
    <div class="text-center max-w-2xl mx-auto mb-12">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-950/80 border border-[#C8A97E]/30 text-xs text-gold-shimmer mb-4 backdrop-blur-md">
        <lucide-angular [img]="HelpCircleIcon" class="w-3.5 h-3.5 text-[#C8A97E]"></lucide-angular>
        <span class="font-semibold tracking-[0.2em] uppercase text-[11px]">FREQUENTLY ASKED QUESTIONS</span>
      </div>

      <h2 class="font-display-title text-3xl sm:text-4xl lg:text-5xl font-bold text-white tracking-tight">
        Clear Answers &bull; Honest Care
      </h2>

      <p class="text-sm sm:text-base text-[#9BB0A5] mt-3 leading-relaxed">
        Everything you need to know about our ingredients, shades, safety, and application protocol.
      </p>
    </div>

    <!-- Search & Category Filter -->
    <div class="space-y-4 mb-10">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#7A8E83]">
          <lucide-angular [img]="SearchIcon" class="w-4 h-4"></lucide-angular>
        </div>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search by topic, ingredient, or application..."
          class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white/[0.03] border border-white/10 focus:border-[#C8A97E]/60 text-sm text-white placeholder-[#687C71] focus:outline-none focus:ring-1 focus:ring-[#C8A97E]/40 transition-colors"
        />
      </div>

      <div class="flex flex-wrap gap-2 justify-center">
        <button
          *ngFor="let cat of categories"
          (click)="setCategory(cat.id)"
          [ngClass]="{
            'bg-emerald-950 text-white border border-[#C8A97E]/50': activeCategory === cat.id,
            'bg-white/[0.02] text-[#8EA096] border border-white/5 hover:text-white': activeCategory !== cat.id
          }"
          class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all cursor-pointer"
        >
          {{ cat.label }}
        </button>
      </div>
    </div>

    <!-- Accordion List -->
    <div class="space-y-3.5">
      <ng-container *ngIf="filteredFaqs.length > 0; else noResults">
        <div
          *ngFor="let faq of filteredFaqs"
          class="rounded-2xl glass-panel-card border border-white/10 overflow-hidden transition-all duration-200"
        >
          <button
            (click)="toggleItem(faq.id)"
            class="w-full p-5 sm:p-6 text-left flex items-center justify-between gap-4 cursor-pointer focus:outline-none"
            [attr.aria-expanded]="openId === faq.id"
          >
            <span class="font-display-title text-base sm:text-lg font-bold text-white hover:text-emerald-200 transition-colors">
              {{ faq.question }}
            </span>
            <div
              [ngClass]="{ 'rotate-180 bg-[#C8A97E]/10 border-[#C8A97E]/30': openId === faq.id }"
              class="w-8 h-8 rounded-full bg-white/[0.04] border border-white/10 flex items-center justify-center text-[#C8A97E] shrink-0 transition-transform duration-300"
            >
              <lucide-angular [img]="ChevronDownIcon" class="w-4 h-4"></lucide-angular>
            </div>
          </button>

          <div
            [@expandCollapse]="openId === faq.id ? 'expanded' : 'collapsed'"
          >
            <div class="px-5 sm:px-6 pb-6 pt-1 text-sm text-[#B5C4BC] leading-relaxed border-t border-white/5">
              {{ faq.answer }}
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #noResults>
        <div class="text-center py-12 text-sm text-[#7A8E83]">
          No questions found matching &ldquo;{{ searchQuery }}&rdquo;. Try another term.
        </div>
      </ng-template>
    </div>

  </div>
</section>
